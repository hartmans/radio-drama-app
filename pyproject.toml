[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-drama-app"
version = "0.1.0"
description = "Render XML radio dramas with generated speech and audio effects"
readme = "README.md"
license-files = ["vibevoice/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135,<1",
    "pytest>=8,<10",
    "uvicorn>=0.42,<1",
    "whisperx",
    "carthage",
    "qwen-tts",
    "pedalboard>=0.9,<1",
    "PyYAML>=6,<7",
    "Pillow>=11,<12",
    "diffusers",
]

[project.scripts]
radio_drama_app = "radio_drama.cli:main"

[tool.setuptools.package-dir]
"" = "."
vibevoice = "vibevoice/vibevoice"

[tool.setuptools.packages.find]
where = [".", "vibevoice"]
include = ["radio_drama", "radio_drama.*", "radio_drama_tts_container", "radio_drama_tts_container.*", "vibevoice", "vibevoice.*"]
namespaces = false

[tool.setuptools.package-data]
vibevoice = ["configs/*.json"]
